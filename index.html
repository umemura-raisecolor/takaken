<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鷹建(タカケン)|富士見市の外壁塗装・屋根塗装</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">

<!--
=====================================================
  ★ 使い方 ★
  下の「CONFIG」の中だけを書き換えてください。
  ・使わない項目は "" (空)、リストは [] にすると表示されません
  ・写真は同じフォルダに入れた画像のファイル名
=====================================================
-->
<script>
const CONFIG = {
  // ── 会社の基本情報 ──
  companyName: "鷹建(タカケン)",
  logoSub: "富士見市の外壁塗装・屋根塗装",
  area: "富士見市・ふじみ野市・三芳町・川越市・所沢市ほか",
  phone: "049-268-1951",
  phoneHours: "営業 9:30〜19:00(日曜定休)",

  // ── メインのキャッチコピー ──
  catchLine1: "自分の家を塗るような",
  catchLine2: "気持ちで、塗っています。",
  subCopy: "家族や親族も塗装屋という家に育ち、小さい頃から塗装に携わってきました。大手のリフォーム会社を通さず直接お請けするので、中間マージンがかからず、金額も抑えられます。",

  // ── 強み(相手のサイトに書いてあることだけ) ──
  strengths: [
    { big: "独立10年", small: "きちんとした仕事がしたくて独立" },
    { big: "塗装一家", small: "小さい頃から塗装に携わって" },
    { big: "中間マージンなし", small: "直接のご依頼で金額を抑えます" }
  ],

  // ── ボタン ──
  ctaMain: "無料で相談・見積もりを申し込む",
  ctaLink: "http://takaken7888.jp/",
  fixMailLabel: "フォームで相談する(24時間)",

  // ── 写真 ──
  heroImage: "",                    // 背景写真(空なら色のグラデーション)
  heroPhoto: "president.jpg",       // メインの右側に出す写真(社長の顔など)
  heroPhotoCaption: "お気軽にお電話・ご相談ください(※写真はイメージです)",

  // ── 上のメニュー ──
  menu: ["タカケンの特徴", "サービスのご案内", "施工事例", "会社概要", "お問合せ"],

  // ── 会社だけのブロック(不要なら title を "") ──
  message: {
    title: "タカケンの想い",
    lead: "喜んでいただける仕事を、\nいつも心がけています。",
    body: "タカケンは、家族や親族も塗装屋さんが多く、小さい頃から塗装に携わってきました。きちんとした仕事がしたいという思いで独立して10年。自分の家を塗るような気持ちで、一軒一軒のお住まいに向き合っています。",
    name: "鷹建(タカケン)"
  },

  // ── お客様の声(なければ []) ──
  voicesTitle: "お客様の声",
  voicesNote: "",
  voices: [],

  // ── 色 ──
  mainColor: "#3f6b22",
  accentColor: "#e07b1f",

  // ── デモであることの表示 ──
  showDemoNotice: true,
  demoNotice: "このページは鷹建(タカケン)様のためにお作りしたホームページのデモです。"
};
</script>

<style>
  :root{
    --main:#3f6b22; --accent:#e07b1f;
    --ink:#1e2329; --muted:#4a525c; --paper:#ffffff; --soft:#f4f3ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);background:var(--paper);font-size:18px;line-height:1.85;letter-spacing:.03em}
  a{color:inherit;text-decoration:none}

  .demo{background:var(--soft);color:var(--muted);font-size:14px;text-align:center;padding:10px 16px;line-height:1.6}

  header{background:#fff;border-bottom:1px solid #e6e3dd;position:sticky;top:0;z-index:20}
  .head-in{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .logo small{display:block;font-size:13px;color:var(--muted);letter-spacing:.06em;line-height:1.4}
  .logo strong{display:block;font-family:"Noto Serif JP",serif;font-size:24px;color:var(--main);line-height:1.3;font-weight:900}
  nav{display:flex;gap:26px;font-size:16px;font-weight:500}
  .head-tel{text-align:right;line-height:1.35;white-space:nowrap}
  .head-tel a{font-size:26px;font-weight:900;color:var(--main);letter-spacing:.02em}
  .head-tel span{display:block;font-size:13px;color:var(--muted)}

  .hero{position:relative;min-height:620px;display:flex;align-items:center;color:#fff;overflow:hidden;
    background:linear-gradient(135deg,var(--main) 0%,#24401a 100%)}
  .hero-img{position:absolute;inset:0;background-size:cover;background-position:center}
  .hero.has-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,25,10,.82),rgba(15,25,10,.3))}
  .hero-in{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:80px 20px 150px;width:100%;
    display:grid;grid-template-columns:1.25fr .85fr;gap:48px;align-items:center}
  .hero-in.no-photo{grid-template-columns:1fr}
  .area{display:inline-block;border:1px solid rgba(255,255,255,.7);padding:6px 18px;font-size:16px;margin-bottom:26px;letter-spacing:.04em}
  h1{font-family:"Noto Serif JP",serif;font-weight:900;font-size:clamp(30px,4.6vw,56px);line-height:1.45;letter-spacing:.04em}
  h1 span{display:block}
  .sub{max-width:640px;margin-top:26px;font-size:19px;line-height:1.95;color:rgba(255,255,255,.93)}
  .cta-row{display:flex;flex-wrap:wrap;gap:16px 28px;margin-top:38px;align-items:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;
    font-size:20px;font-weight:700;padding:20px 36px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .tel-big{color:#fff;line-height:1.35}
  .tel-big a{font-size:30px;font-weight:900;letter-spacing:.02em}
  .tel-big span{display:block;font-size:14px;color:rgba(255,255,255,.85)}
  .photo-card{background:#fff;padding:12px 12px 16px;box-shadow:0 16px 40px rgba(0,0,0,.3);transform:rotate(1.2deg)}
  .photo-card img{display:block;width:100%;height:auto}
  .photo-card p{color:var(--ink);font-size:16px;text-align:center;margin-top:12px;font-weight:500;line-height:1.6}

  .strengths{position:relative;z-index:5;max-width:1100px;margin:-90px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .st{background:#fff;border-top:5px solid var(--main);box-shadow:0 10px 30px rgba(20,30,15,.12);padding:30px 18px;text-align:center}
  .st b{display:block;font-family:"Noto Serif JP",serif;font-size:30px;color:var(--main);line-height:1.35;font-weight:900}
  .st small{display:block;font-size:16px;color:var(--muted);margin-top:6px}

  .msg{max-width:900px;margin:0 auto;padding:90px 20px 100px}
  .msg h2{font-size:17px;color:var(--main);letter-spacing:.12em;font-weight:700;text-align:center;margin-bottom:22px}
  .msg-lead{font-family:"Noto Serif JP",serif;font-weight:900;font-size:clamp(24px,3.4vw,34px);line-height:1.7;text-align:center;white-space:pre-line}
  .msg-body{margin-top:34px;background:var(--soft);padding:34px 38px;font-size:18px;line-height:2}
  .msg-name{margin-top:20px;text-align:right;font-family:"Noto Serif JP",serif;font-size:22px;font-weight:700;color:var(--main)}

  .voices{background:var(--soft);padding:90px 20px 100px}
  .voices-in{max-width:1100px;margin:0 auto}
  .voices h2{font-family:"Noto Serif JP",serif;font-size:clamp(26px,3.4vw,34px);font-weight:900;text-align:center}
  .voices-note{text-align:center;color:var(--muted);font-size:16px;margin-top:8px}
  .v-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
  .v{background:#fff;padding:30px 28px;border-radius:4px;display:flex;flex-direction:column}
  .v p{font-size:17px;line-height:1.95;flex:1}
  .v small{display:block;margin-top:16px;color:var(--muted);font-size:15px;text-align:right}

  .fixbar{display:none}

  @media (max-width:1080px){ nav{display:none} }
  @media (max-width:860px){
    .hero-in{grid-template-columns:1fr;gap:36px}
    .photo-card{max-width:440px;transform:none}
  }
  @media (max-width:720px){
    body{font-size:17px}
    .head-in{padding:12px 16px}
    .logo small{font-size:12px}
    .logo strong{font-size:20px}
    .head-tel{display:none}
    .hero{min-height:auto}
    .hero-in{padding:56px 16px 120px}
    .sub{font-size:17px}
    .btn{width:100%;font-size:19px;padding:18px 16px}
    .tel-big{display:none}
    .strengths{grid-template-columns:1fr;margin-top:-70px;padding:0 16px;gap:14px}
    .st{padding:22px 16px}
    .st b{font-size:26px}
    .msg{padding:64px 16px 120px}
    .msg-body{padding:24px 20px;font-size:17px}
    .voices{padding:64px 16px 120px}
    .v-grid{grid-template-columns:1fr;gap:14px;margin-top:28px}
    .fixbar{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:30;box-shadow:0 -4px 14px rgba(0,0,0,.15)}
    .fixbar a{display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 8px;font-size:16px;font-weight:700;color:#fff;line-height:1.4}
    .fixbar .f-tel{background:var(--main)}
    .fixbar .f-mail{background:var(--accent)}
  }
</style>
</head>
<body>

<div class="demo" id="demo"></div>

<header>
  <div class="head-in">
    <a class="logo" href="#"><small id="logoSub"></small><strong id="logoName"></strong></a>
    <nav id="nav"></nav>
    <div class="head-tel"><a id="headTel" href="#"></a><span id="headHours"></span></div>
  </div>
</header>

<section class="hero" id="hero">
  <div class="hero-img" id="heroImg"></div>
  <div class="hero-in" id="heroIn">
    <div>
      <div class="area" id="area"></div>
      <h1><span id="c1"></span><span id="c2"></span></h1>
      <p class="sub" id="sub"></p>
      <div class="cta-row">
        <a class="btn" id="cta" href="#"></a>
        <div class="tel-big"><a id="heroTel" href="#"></a><span id="heroHours"></span></div>
      </div>
    </div>
    <figure class="photo-card" id="photoCard"><img id="heroPhoto" alt=""><p id="heroPhotoCap"></p></figure>
  </div>
</section>

<div class="strengths" id="strengths"></div>

<section class="msg" id="msg">
  <h2 id="msgTitle"></h2>
  <p class="msg-lead" id="msgLead"></p>
  <p class="msg-body" id="msgBody"></p>
  <p class="msg-name" id="msgName"></p>
</section>

<section class="voices" id="voices">
  <div class="voices-in">
    <h2 id="voicesTitle"></h2>
    <p class="voices-note" id="voicesNote"></p>
    <div class="v-grid" id="vGrid"></div>
  </div>
</section>

<div class="fixbar">
  <a class="f-tel" id="fixTel" href="#">電話で相談する</a>
  <a class="f-mail" id="fixMail" href="#"></a>
</div>

<script>
(function(){
  const C = CONFIG, $ = id => document.getElementById(id);
  const setText = (id, v) => { const el = $(id); if (!v) { el.style.display = "none"; } else { el.textContent = v; } };
  const telHref = "tel:" + (C.phone || "").replace(/[^0-9+]/g, "");

  document.documentElement.style.setProperty("--main", C.mainColor);
  document.documentElement.style.setProperty("--accent", C.accentColor);

  if (C.showDemoNotice) $("demo").textContent = C.demoNotice; else $("demo").style.display = "none";
  setText("logoSub", C.logoSub);
  setText("logoName", C.companyName);
  $("nav").innerHTML = (C.menu || []).map(m => '<a href="#">' + m + '</a>').join("");

  setText("headTel", C.phone); $("headTel").href = telHref;
  setText("headHours", C.phoneHours);
  setText("heroTel", C.phone); $("heroTel").href = telHref;
  setText("heroHours", C.phoneHours);

  if (C.heroImage) { $("heroImg").style.backgroundImage = 'url("' + C.heroImage + '")'; $("hero").classList.add("has-bg"); }
  if (C.heroPhoto) { $("heroPhoto").src = C.heroPhoto; setText("heroPhotoCap", C.heroPhotoCaption); }
  else { $("photoCard").style.display = "none"; $("heroIn").classList.add("no-photo"); }

  setText("area", C.area ? "対応エリア|" + C.area : "");
  setText("c1", C.catchLine1);
  setText("c2", C.catchLine2);
  setText("sub", C.subCopy);
  setText("cta", C.ctaMain); $("cta").href = C.ctaLink || "#";
  $("fixTel").href = telHref; $("fixMail").href = C.ctaLink || "#";
  $("fixMail").textContent = C.fixMailLabel || "無料相談を申し込む";

  $("strengths").innerHTML = (C.strengths || []).filter(s => s.big).map(s =>
    '<div class="st"><b>' + s.big + '</b><small>' + (s.small || "") + '</small></div>').join("");

  const M = C.message || {};
  if (!M.title) $("msg").style.display = "none";
  else { setText("msgTitle", M.title); setText("msgLead", M.lead); setText("msgBody", M.body); setText("msgName", M.name); }

  const V = (C.voices || []).filter(v => v.text);
  if (!V.length) $("voices").style.display = "none";
  else {
    setText("voicesTitle", C.voicesTitle); setText("voicesNote", C.voicesNote);
    $("vGrid").innerHTML = V.map(v => '<div class="v"><p>' + v.text + '</p><small>' + (v.who || "") + '</small></div>').join("");
  }
})();
</script>
</body>
</html>
